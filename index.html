<title>Iron Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFEA; --surface:#FFFFFF; --surface2:#F8F2ED; --ink:#1F1512; --muted:#6F5F57; --line:#E7DBD2;
  --accent:#C9281A; --accent-ink:#FFFFFF; --accent-soft:#FCDCCB; --accent2:#E8740C;
  --pr:#9A6F0E; --pr-soft:#F7EACB; --good:#1D8449; --good-soft:#DCF1E4; --danger:#C22D2D; --danger-soft:#F9E0E0;
  --p-red:#D23030; --p-saffron:#E8740C; --p-yellow:#E2B01B; --p-green:#2C8A45; --p-white:#E6E9EE; --p-black:#2A2F38; --p-steel:#9AA3B1;
  --m-arms:#B0245E; --m-core:#7A6A62; --m-cardio:#8D5A2B;
  --shade:rgba(24,12,6,.45);
  --glow1:rgba(244,140,20,.24); --glow2:rgba(214,40,40,.14); --glow3:rgba(244,140,20,.14); --knurl:rgba(60,25,10,.05);
  --glass:rgba(255,255,255,.80); --hero1:#E8740C; --hero2:#B3151E;
  --glowbg:radial-gradient(75% 45% at 105% -5%,var(--glow1),transparent 70%),radial-gradient(65% 40% at -10% 22%,var(--glow2),transparent 70%),radial-gradient(85% 50% at 60% 105%,var(--glow3),transparent 70%);
  --fd:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --nav:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140E0B; --surface:#1F1714; --surface2:#2A201C; --ink:#F3EAE4; --muted:#AD978C; --line:#3B2D27;
    --accent:#FF6F43; --accent-ink:#140E0B; --accent-soft:#41200F; --accent2:#FFA133;
    --pr:#E6BD50; --pr-soft:#372D16; --good:#4DC37F; --good-soft:#15321F; --danger:#F07474; --danger-soft:#3A1B1B;
    --p-white:#D5D9E0; --p-black:#4A515D; --m-arms:#E0598F; --m-core:#A08F86; --m-cardio:#C08552;
    --shade:rgba(0,0,0,.6); color-scheme:dark;
    --glow1:rgba(244,140,20,.16); --glow2:rgba(214,40,40,.12); --glow3:rgba(244,140,20,.08); --knurl:rgba(255,255,255,.035); --glass:rgba(31,23,20,.8); --hero1:#C2600A; --hero2:#7E0E16;
    
  }
}
:root[data-theme="dark"]{
  --bg:#140E0B; --surface:#1F1714; --surface2:#2A201C; --ink:#F3EAE4; --muted:#AD978C; --line:#3B2D27;
  --accent:#FF6F43; --accent-ink:#140E0B; --accent-soft:#41200F; --accent2:#FFA133;
  --pr:#E6BD50; --pr-soft:#372D16; --good:#4DC37F; --good-soft:#15321F; --danger:#F07474; --danger-soft:#3A1B1B;
  --p-white:#D5D9E0; --p-black:#4A515D; --m-arms:#E0598F; --m-core:#A08F86; --m-cardio:#C08552;
  --shade:rgba(0,0,0,.6); color-scheme:dark;
    --glow1:rgba(244,140,20,.16); --glow2:rgba(214,40,40,.12); --glow3:rgba(244,140,20,.08); --knurl:rgba(255,255,255,.035); --glass:rgba(31,23,20,.8); --hero1:#C2600A; --hero2:#7E0E16;
    
}

:root{--hm-body:#332A27;--mode-gym:#E8740C;--mode-cali:#2E9E48;--mode-cross:#2B7BE0;--mode-cardio:#9B3CC4}
:root[data-mode="cardio"]{--accent:#8E2DB8;--accent2:#D6589E;--accent-soft:#F0DCF6;--hero1:#D6589E;--hero2:#5E1F91;--glow1:rgba(214,88,158,.22);--glow2:rgba(142,45,184,.14);--glow3:rgba(214,88,158,.12)}
:root[data-mode="cali"]{--accent:#1E8A3E;--accent2:#8CC63F;--accent-soft:#D9F0D3;--hero1:#6DBE45;--hero2:#146B34;--glow1:rgba(120,195,70,.26);--glow2:rgba(20,120,60,.15);--glow3:rgba(120,195,70,.14)}
:root[data-mode="cross"]{--accent:#1F5FD1;--accent2:#2BB3E8;--accent-soft:#D6E6FB;--hero1:#2BA6E8;--hero2:#163FA6;--glow1:rgba(43,166,232,.24);--glow2:rgba(31,95,209,.15);--glow3:rgba(43,166,232,.13)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--hm-body:#5E524C}
  :root[data-mode="cali"]:not([data-theme="light"]){--accent:#5BD27A;--accent2:#B5E36A;--accent-soft:#15361F;--hero1:#3E9A35;--hero2:#0E4A24;--glow1:rgba(120,195,70,.15);--glow2:rgba(20,120,60,.12);--glow3:rgba(120,195,70,.07)}
  :root[data-mode="cardio"]:not([data-theme="light"]){--accent:#D48CFF;--accent2:#FF8CC6;--accent-soft:#361A45;--hero1:#B04A86;--hero2:#46166E;--glow1:rgba(214,88,158,.14);--glow2:rgba(142,45,184,.12);--glow3:rgba(214,88,158,.07)}
  :root[data-mode="cross"]:not([data-theme="light"]){--accent:#6FA8FF;--accent2:#5CD0FF;--accent-soft:#14284A;--hero1:#1F7FC2;--hero2:#0F2A70;--glow1:rgba(43,166,232,.15);--glow2:rgba(31,95,209,.12);--glow3:rgba(43,166,232,.07)}
}
:root[data-theme="dark"]{--hm-body:#5E524C}
:root[data-mode="cali"][data-theme="dark"]{--accent:#5BD27A;--accent2:#B5E36A;--accent-soft:#15361F;--hero1:#3E9A35;--hero2:#0E4A24;--glow1:rgba(120,195,70,.15);--glow2:rgba(20,120,60,.12);--glow3:rgba(120,195,70,.07)}
:root[data-mode="cardio"][data-theme="dark"]{--accent:#D48CFF;--accent2:#FF8CC6;--accent-soft:#361A45;--hero1:#B04A86;--hero2:#46166E;--glow1:rgba(214,88,158,.14);--glow2:rgba(142,45,184,.12);--glow3:rgba(214,88,158,.07)}
:root[data-mode="cross"][data-theme="dark"]{--accent:#6FA8FF;--accent2:#5CD0FF;--accent-soft:#14284A;--hero1:#1F7FC2;--hero2:#0F2A70;--glow1:rgba(43,166,232,.15);--glow2:rgba(31,95,209,.12);--glow3:rgba(43,166,232,.07)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--glowbg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(45deg,var(--knurl) 0 1px,transparent 1px 9px),repeating-linear-gradient(-45deg,var(--knurl) 0 1px,transparent 1px 9px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 50%);mask-image:linear-gradient(180deg,#000,transparent 50%)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.grow{flex:1}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{max-width:640px;margin:0 auto;padding:8px 16px 0;display:flex;align-items:center;gap:9px}
.brand-logo{flex:none;border-radius:8px}
.brand-name{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);line-height:1}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-in h1{margin:0;font-family:var(--fd);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.top-act{display:flex;gap:4px;align-items:center}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px))}
body.has-mini main{padding-bottom:calc(var(--nav) + 120px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tabs button[aria-current="page"]{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}
.iconbtn.sm svg{width:18px;height:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost-danger{background:transparent;border-color:transparent;color:var(--danger);margin-top:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow.center{justify-content:center}

/* sections */
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;gap:12px}
.sec h2{margin:0;font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{display:block;width:100%;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left}
button.card:hover,article.card:hover{border-color:var(--muted)}
.empty{color:var(--muted);margin:8px 0}
.emptybox{text-align:center;padding:40px 12px}
.emptybox .eb-icon{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);margin-bottom:10px}
.emptybox h3{font-family:var(--fd);font-size:24px;margin:0 0 6px;text-transform:uppercase}
.emptybox p{color:var(--muted);max-width:34ch;margin:0 auto 18px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pr-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0 4px;font-size:14px}

/* workout tab */
.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2));color:#fff;border-radius:20px;padding:18px 16px 16px;margin-top:4px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;position:relative;overflow:hidden;box-shadow:0 14px 32px -14px var(--hero2)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 104% -8%,transparent 0 52px,rgba(255,255,255,.13) 52px 57px,transparent 57px 78px,rgba(255,255,255,.08) 78px 108px,transparent 108px 124px,rgba(255,255,255,.05) 124px 128px,transparent 128px)}
.hero>*{position:relative;z-index:1}
.hero .btn.pri{background:#fff;color:var(--hero2)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18)}
.hero-btns{display:grid;gap:8px}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.hero-row .btn{padding:0 8px;font-size:15px;min-width:0;white-space:normal;line-height:1.2}
.hero-date{font-size:15px;font-weight:600;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.08em}
.week{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wk-l{font-size:14px;display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;width:100%;color:rgba(255,255,255,.85)}
.wk-l .kw{font-size:26px;color:#fff;letter-spacing:.02em}
.wk-l span:last-child{margin-left:auto}
.wk-nav{display:flex;align-items:center;gap:4px;width:100%}
.wk-nav .wds{flex:1;min-width:0;justify-content:space-between;gap:2px}
.wk-arrow{flex:none;width:28px!important}
.wk-arrow{color:#fff}
.wk-arrow:hover{background:rgba(255,255,255,.15)}
.wk-arrow:disabled{opacity:.3}
.wk-l b{font-family:var(--fd);font-size:22px}
.wds{display:flex;gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:rgba(255,255,255,.75);width:32px;flex:none}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-size:15px;font-weight:700;color:#fff}
.wd.on i{background:#fff;border-color:#fff;color:var(--hero2)}
.wd:disabled{opacity:.4}
.wd.today{color:#fff}
.wd.today i{border-color:#fff}
.rgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.rgrid{grid-template-columns:1fr 1fr}}
.rcard{display:grid;gap:4px}
.rname{font-family:var(--fd);font-size:21px;font-weight:700}
.rex{font-size:14px;color:var(--muted);line-height:1.35}
.rlast{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:4px}
.tool{display:flex;align-items:center;gap:14px}
.tool b{display:block;font-family:var(--fd);font-size:19px}
.tool span{font-size:14px;color:var(--muted)}
.tool .plate-ic{flex:none}

/* history */
.month{font-family:var(--fd);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;display:flex;justify-content:space-between}
.hlist{display:grid;gap:10px}
.hcard{cursor:pointer;display:grid;gap:6px}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hc-top b{font-family:var(--fd);font-size:20px}
.hc-meta{font-size:14px;color:var(--muted)}
.hc-ex{display:grid;gap:3px;font-size:14px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.hc-ex div{display:flex;justify-content:space-between;gap:10px}
.hc-ex span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-ex .num{font-size:15px;color:var(--muted);flex:none}
.pr{display:inline-flex;gap:4px;align-items:center;background:var(--pr-soft);color:var(--pr);font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pr svg{width:14px;height:14px}

/* stats + charts */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
@media (min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{font-family:var(--fd);font-size:30px;font-weight:700;display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ccard{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
.ccard h4{margin:0 4px 8px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ccard h4 span{color:var(--muted);font-weight:500}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.8}
.chart .pt-last{fill:var(--accent)}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--fb)}
.chart .bar{fill:color-mix(in srgb,var(--accent2) 45%,var(--surface2))}
.chart .bar.hi{fill:var(--accent)}
.spk{width:84px;height:28px;flex:none}
.spk polyline{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spk circle{fill:var(--accent)}
.mbars{display:grid;gap:8px;padding:2px 4px 8px}
.mbar{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.mbar .trk{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.mbar .trk i{display:block;height:100%;border-radius:5px;background:var(--c)}
.mbar .num{text-align:right;font-size:16px}
.stack{display:grid;gap:12px;margin-top:12px}

/* lists */
.rows{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{min-width:0}
.row b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);font-size:13px;display:block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,var(--muted));flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{margin:4px 0 10px}

/* forms */
.inp{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp.code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.inp.big{font-family:var(--fd);font-size:22px;font-weight:600}
.inp.sm{height:36px}
.field{display:grid;gap:6px;margin-bottom:14px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{height:34px;padding:0 16px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15);color:var(--accent)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.set-group{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.set-group h5{margin:0 0 10px;font-size:14px}
.msg{margin:4px 0 8px;color:var(--ink)}

/* body */
.bhero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.bhero b{font-family:var(--fd);font-size:52px;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums}
.bhero b small{font-size:22px;color:var(--muted);margin-left:4px}
.bhero .delta{font-size:14px;color:var(--muted)}
.bvals{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.bvals span b{display:inline;color:var(--ink);font-family:var(--fd);font-size:15px}

/* editor */
#editor{position:fixed;inset:0;z-index:40;background:var(--glowbg),var(--bg);display:flex;flex-direction:column}
.ed-top{padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ed-top-in{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px}
.ed-clock{flex:1;text-align:center;font-size:22px;font-weight:600}
.ed-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ed-inner{max-width:640px;margin:0 auto;padding:10px 16px 150px}
.ed-name{font-family:var(--fd);font-size:30px;font-weight:700;border:0;background:transparent;width:100%;padding:4px 0;border-radius:6px}
.ed-sub{color:var(--muted);font-size:14px}
.ed-when{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:6px}
.ed-note{width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;margin-top:10px;resize:none;font-size:15px;min-height:40px}
.exb{margin-top:24px}
.exb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.exb-name{font-family:var(--fd);font-weight:700;font-size:21px;color:var(--accent);line-height:1.15}
.exb-note{font-size:14px;color:var(--muted);margin:-2px 0 6px;white-space:pre-wrap}
.set{display:grid;gap:6px;align-items:center;padding:3px 4px;border-radius:10px}
.set.c5{grid-template-columns:34px minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) 44px}
.set.c4{grid-template-columns:34px minmax(0,1.25fr) minmax(0,1.6fr) 44px}
.set-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-block:0 2px}
.set-h span{text-align:center}
.set.done{background:var(--good-soft)}
.set-n{font-family:var(--fd);font-weight:700;font-size:18px;height:36px;border-radius:9px;text-align:center;background:var(--surface2)}
.set.done .set-n{background:transparent}
.set-n.t-w{color:var(--pr)}
.set-n.t-d{color:var(--accent)}
.set-n.t-f{color:var(--danger)}
.set-prev{color:var(--muted);font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:36px}
.si{height:38px;border-radius:9px;border:1px solid transparent;background:var(--surface2);text-align:center;width:100%;min-width:0;font-family:var(--fd);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.si::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.si:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.set.done .si{background:transparent}
.chk{width:44px;height:36px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.set.done .chk{background:var(--good);color:#fff}
.set.done .chk.trophy{background:var(--pr);color:#fff}
.exb-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.addex{margin-top:28px}
.rest{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.rest-in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.rest-prog{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.rest-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .25s linear}
.rest-row{display:flex;align-items:center;gap:8px}
.rest-t{flex:1;text-align:center;font-size:28px;font-weight:700}
.rest-t small{font-family:var(--fb);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-right:4px}

/* mini bar */
#miniBar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:25;padding:0 12px 8px}
.mini-in{max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.mini-in div{flex:1;min-width:0}
.mini-in b{display:block;font-family:var(--fd);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-in span{font-size:14px;opacity:.8}

/* sheets */
.sheet-back{position:fixed;inset:0;background:var(--shade);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet-back.out{animation:fadeout .18s ease forwards}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 24px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 6px 16px}
.sheet-h h3{margin:0;font-family:var(--fd);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{overflow-y:auto;padding:4px 16px 18px;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-f{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:500;width:100%}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
.menu button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.rest-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkrow .pk-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.pkrow.sel .pk-chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pkrow .pk-chk svg{width:16px;height:16px}
.pk-top{position:sticky;top:-4px;background:var(--surface);padding:4px 0 6px;z-index:1;display:grid;gap:8px}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.wstats div{background:var(--surface2);border-radius:12px;padding:10px}
.wstats b{display:block;font-family:var(--fd);font-size:22px;line-height:1.1}
.wstats span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wd-ex{margin-top:16px}
.wd-ex h5{margin:0 0 6px;font-family:var(--fd);font-size:19px;color:var(--accent)}
.wd-set{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.wd-set:last-child{border-bottom:0}
.wd-set .n{font-family:var(--fd);font-weight:700;color:var(--muted);text-align:center}
.wd-set .n.t-w{color:var(--pr)}
.prs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.re-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface2)}
.re-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.re-top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.re-mv{display:flex;flex:none}
.re-ctl{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.re-t{display:flex;align-items:center;gap:8px}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}

.stepper span{min-width:28px;text-align:center;font-size:19px;font-weight:700}
.pc-in{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plates-svg{width:100%;height:auto;display:block;margin:6px 0 10px}

.ex-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:12px}
.rtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}

.rtiles span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hist-row{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-row b{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sync{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:2px 0 14px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)}
.sync.err i{background:var(--danger)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.cal-h b{font-family:var(--fd);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:2px 0 4px}
.cd{position:relative;width:100%;max-width:44px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:17px;font-weight:600;text-align:center}

.cal-card{padding:14px 12px 12px;margin-top:4px}
/* overload hint */
.hint{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:2px 0 8px}

.hint-ok{font-size:12px;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.06em;flex:none}
/* supersets */
.exb.ss{border-left:3px solid var(--accent);padding-left:10px;margin-left:-13px}
.exb.ss-mid,.exb.ss-last{margin-top:0;padding-top:14px}
.ss-lab,.ss-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ss-lab{margin-bottom:2px}
.ss-tag{font-family:var(--fb);vertical-align:2px;margin-left:4px}
/* heatmap */
.heat-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:center;padding:0 4px}
.heat{border-radius:10px}
.heat{width:100%;height:auto;display:block}
.heat .hmb{fill:var(--line)}
.heat .hm0{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.heat rect,.heat ellipse,.heat path{stroke:var(--surface);stroke-width:1}
.heat-list{display:grid;gap:6px;font-size:13px}
.heat-list div{display:grid;grid-template-columns:1fr auto;gap:0 8px}
.heat-list .num{font-size:15px;text-align:right}
.heat-list small{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:-2px}
.heat-list small.rec{color:var(--accent);font-weight:600}
.heat-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin:10px 4px 2px}
.heat-leg i{width:18px;height:8px;border-radius:3px;display:inline-block}
.heat-leg i.hm0{background:var(--surface2);border:1px solid var(--line)}
.heat-rest{font-size:13px;color:var(--muted);margin:6px 4px 4px}
@media (max-width:360px){.heat-wrap{grid-template-columns:1fr}}
/* coach */
.coach{margin-top:12px}

.coach-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2))}
.msgs{display:grid;gap:10px;padding-top:4px}
.msg-u{justify-self:end;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-radius:16px 16px 4px 16px;padding:8px 12px;max-width:85%;white-space:pre-wrap}
.msg-a{justify-self:start;background:var(--surface2);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:96%;font-size:15px}

.coach-in{display:flex;gap:8px;flex:1;min-width:0}
.coach-in textarea{resize:none;height:44px;padding:11px 12px}
.tl-ex{font-family:var(--fd);font-size:17px;line-height:1.5;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--muted)}
.report{margin-top:12px;display:grid;gap:10px}
.rep-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.rep-h span{font-size:13px;color:var(--muted)}
.rep-toggle{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:8px}

.rep-chev{display:inline-grid;place-items:center;color:var(--muted);transition:transform .2s}

.rep-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

/* ---------- units + formatting ---------- */
const KG2LB=2.2046226218,KM2MI=0.621371192,CM2IN=0.3937007874;
const isLb=()=>S.settings.units==='lb';
const U={w:()=>isLb()?'lb':'kg',d:()=>isLb()?'mi':'km',len:()=>isLb()?'in':'cm'};
const nf=(n,d=1)=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:d});
const fmtIn=(v,d)=>Number(v).toLocaleString('en-GB',{maximumFractionDigits:d,useGrouping:false});
function parseNum(s){if(s==null)return null;s=String(s).trim().replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:null;}
const wv=kg=>kg==null?null:(isLb()?kg*KG2LB:kg);
const wf=kg=>kg==null?'':nf(wv(kg),isLb()?1:2);
const wInv=kg=>kg==null?'':fmtIn(wv(kg),isLb()?1:2);
const wIn=s=>{const n=parseNum(s);return n==null?null:(isLb()?n/KG2LB:n);};
const dv=km=>km==null?null:(isLb()?km*KM2MI:km);
const dff=km=>km==null?'':nf(dv(km),2);
const dInv=km=>km==null?'':fmtIn(dv(km),2);
const dIn=s=>{const n=parseNum(s);return n==null?null:(isLb()?n/KM2MI:n);};
function fmtDur(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function parseDur(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(s.includes(':')){const p=s.split(':').map(x=>Number(x.replace(',','.')||0));if(p.some(x=>!isFinite(x)))return null;return Math.round(p.reduce((a,x)=>a*60+x,0));}const n=parseNum(s);return n==null?null:Math.round(n);}
function fmtMins(ms){const m=Math.max(0,Math.round(ms/60000));if(m<60)return m+' min';return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';}
function fmtVol(kg){const v=wv(kg)||0;return(v>=10000?nf(v/1000,1)+'k':nf(v,0))+' '+U.w();}
const dfDay=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const dfShort=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dfTime=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function sod(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function relDay(t){const diff=Math.round((sod(Date.now())-sod(t))/DAY);if(diff===0)return'Today';if(diff===1)return'Yesterday';if(diff>1&&diff<7)return diff+' days ago';return dfDay(t);}
function weekStart(t){const d=new Date(sod(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
const pad2=n=>String(n).padStart(2,'0');
function isoLocal(t){const d=new Date(t);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function toLocalInput(t){const d=new Date(t);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function toDateInput(t){const d=new Date(t);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}

/* ---------- sets + records ---------- */
function hasData(k,s){if(!s)return false;if(k==='wr')return s.w!=null&&s.r>0;if(k==='r')return s.r>0;if(k==='t')return s.t>0;if(k==='dt')return s.d>0||s.t>0;return false;}
function metrics(k,s){const m={e1:0,w:0,vol:0,r:0,t:0,d:0};if(k==='wr'){m.w=s.w||0;m.r=s.r||0;m.vol=m.w*m.r;m.e1=m.r<=1?m.w:m.w*(1+m.r/30);}else if(k==='r'){m.r=s.r||0;}else if(k==='t'){m.t=s.t||0;}else{m.d=s.d||0;m.t=s.t||0;}return m;}
const REC_KEYS={wr:['e1','w','vol'],r:['r'],t:['t'],dt:['d']};
const REC_LABEL={e1:'Est. 1RM',w:'Heaviest',vol:'Best set volume',r:'Most reps',t:'Longest',d:'Longest distance'};
const REC_SHORT={e1:'1RM',w:'Weight',vol:'Volume',r:'Reps',t:'Time',d:'Distance'};
function recConv(key,v){if(key==='e1'||key==='w'||key==='vol')return wv(v);if(key==='d')return dv(v);return v;}
function recFmt(key,v){if(v==null)return'–';if(key==='e1')return nf(wv(v),1)+' '+U.w();if(key==='w')return wf(v)+' '+U.w();if(key==='vol')return nf(wv(v),0)+' '+U.w();if(key==='r')return v+' reps';if(key==='t')return fmtDur(v);if(key==='d')return dff(v)+' '+U.d();return String(v);}

  if(k==='r')return`${s.r??'–'} reps`;
  if(k==='t')return fmtDur(s.t);
  const p=[];if(s.d)p.push(dff(s.d)+' '+U.d());if(s.t)p.push(fmtDur(s.t));if(s.d&&s.t)p.push(fmtDur(s.t/dv(s.d))+' /'+U.d());return p.join(' · ');
}
function workoutVolume(w){let v=0;w.exercises.forEach(e=>{const k=getEx(e.exId).kind;if(k==='wr')e.sets.forEach(s=>{if(hasData(k,s))v+=s.w*s.r;});});return v;}
function workoutSetCount(w){let n=0;w.exercises.forEach(e=>{const k=getEx(e.exId).kind;e.sets.forEach(s=>{if(hasData(k,s))n++;});});return n;}
function bestSet(k,sets){let best=null,bv=-1;sets.forEach(s=>{if(!hasData(k,s))return;const m=metrics(k,s);const v=k==='wr'?m.e1:k==='r'?m.r:k==='t'?m.t:(m.d||m.t/1e4);if(v>bv){bv=v;best=s;}});return best;}

let recCache=null;
function recs(){
  if(recCache&&recCache.ver===ver)return recCache;
  const best={},tags={},hist={},prCount={},prList=[];
  const asc=[...S.workouts].sort((a,b)=>a.start-b.start);
  for(const w of asc){
    tags[w.id]={};let cnt=0;
    w.exercises.forEach((e,ei)=>{
      const k=getEx(e.exId).kind;const keys=REC_KEYS[k];
      const b=best[e.exId]||(best[e.exId]={e1:0,w:0,vol:0,r:0,t:0,d:0,n:0});
      const had=b.n>0;const sess={e1:0,w:0,vol:0,r:0,t:0,d:0,volume:0,sets:0};const at={};
      e.sets.forEach((s,si)=>{
        if(!hasData(k,s))return;const m=metrics(k,s);sess.sets++;sess.volume+=m.vol;
        if(s.type==='w')return;
        for(const key of keys){if(m[key]>sess[key]){sess[key]=m[key];at[key]=si;}}
      });
      if(!sess.sets)return;
      for(const key of keys){
        if(had&&at[key]!=null&&sess[key]>b[key]+1e-9){
          const t=tags[w.id][ei]||(tags[w.id][ei]={});(t[at[key]]||(t[at[key]]=[])).push(key);cnt++;
          prList.push({wid:w.id,date:w.start,exId:e.exId,key,value:sess[key]});
        }
      }
      for(const key of keys){if(sess[key]>b[key])b[key]=sess[key];}
      b.n++;
      (hist[e.exId]||(hist[e.exId]=[])).push({date:w.start,wid:w.id,sets:e.sets,...sess});
    });
    prCount[w.id]=cnt;
  }
  prList.sort((a,b)=>b.date-a.date);
  recCache={ver,best,tags,hist,prCount,prList};
  return recCache;
}
function prevSetsFor(exId,before,excludeId){
  for(const w of S.workouts){if(w.id===excludeId||w.start>=before)continue;const e=w.exercises.find(x=>x.exId===exId);if(e)return e.sets;}
  return null;
}

/* ---------- cloud store (db capability) ---------- */
const DEL={};
const Store={
  db:null,mode:'loading',state:'idle',q:{},slots:0,waitQ:[],
  write(path,data){
    if(!this.db)return Promise.resolve(false);
    return new Promise(res=>{
      const q=this.q[path]||(this.q[path]={busy:false,has:false,data:null,waiters:[]});
      q.data=data;q.has=true;q.waiters.push(res);
      if(!q.busy)this._run(path,q);
    });
  },
  async _slot(){if(this.slots<4){this.slots++;return;}await new Promise(r=>this.waitQ.push(r));this.slots++;},
  _free(){this.slots--;const n=this.waitQ.shift();if(n)n();},
  async _run(path,q){
    q.busy=true;let ok=true;setSync('saving');
    while(q.has){
      const d=q.data;q.has=false;q.data=null;
      ok=await this._op(path,d);
      if(!ok&&!q.has&&this.db){await sleep(900+Math.random()*900);if(!q.has)ok=await this._op(path,d);}
    }
    q.busy=false;const w=q.waiters;q.waiters=[];w.forEach(f=>f(ok));
    if(!Object.values(this.q).some(x=>x.busy))setSync(ok?'ok':'error');
  },
  async _op(path,d){
    await this._slot();
    try{const ref=this.db.doc(path);if(d===DEL)await ref.delete();else await ref.set(d);return true;}
    catch(e){console.warn('save failed',path,e);if(e&&['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)){this.db=null;this.mode='local';}return false;}
    finally{this._free();}
  }
};
let syncErrShown=false;
function setSync(s){Store.state=s;const el=$('#syncLine');if(el)el.outerHTML=syncHtml();if(s==='error'&&!syncErrShown){syncErrShown=true;toast("Couldn't save to your account. It's kept on this phone for now.");}}
function syncHtml(){
  if(Store.mode==='cloud')return`<div class="sync ${Store.state==='error'?'err':'ok'}" id="syncLine"><i></i>${Store.state==='error'?'Last save to your Claude account failed. Data is kept on this device.':Store.state==='saving'?'Saving to your Claude account…':'Synced to your Claude account (private to you)'}</div>`;
  if(Store.mode==='loading')return`<div class="sync" id="syncLine"><i></i>Connecting…</div>`;
  return`<div class="sync" id="syncLine"><i></i>Saved on this device only</div>`;
}
const docOf=k=>({settings:S.settings,library:S.customEx,routines:S.routines,body:S.body,active:S.active})[k];

function applyRemote(k,v){
  if(k==='settings')S.settings={...DEFAULT_SETTINGS,...(v||{})};
  else if(k==='library')S.customEx=Array.isArray(v)?v:[];
  else if(k==='routines')S.routines=Array.isArray(v)?v:[];
  else if(k==='body')S.body=Array.isArray(v)?v:[];
  else if(k==='active')S.active=v||null;

async function initDb(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){Store.mode='local';setSync('idle');setTimeout(()=>{ensureModeStarters();ensureReport();},0);return;}
  let db=null;try{db=await C.use('db');}catch(e){}
  if(!db){Store.mode='local';setSync('idle');setTimeout(()=>{ensureModeStarters();ensureReport();},0);return;}
  try{
    const keys=['settings','library','routines','body','active'];
    const snaps=await Promise.all(keys.map(k=>db.doc('app/'+k).get()));
    const ws=await db.collection('workouts').get();
    Store.db=db;Store.mode='cloud';
    let activeChanged=false;
    keys.forEach((k,i)=>{
      const s=snaps[i];const r=s&&s.exists?s.data():null;const rt=r&&r.updatedAt||0;const lt=S.at[k]||0;
      if(r&&rt>0&&rt>=lt){if(rt!==lt){applyRemote(k,clone(r.v));S.at[k]=rt;if(k==='active')activeChanged=true;}}
      else{if(!S.at[k])S.at[k]=Date.now();push(k);}
    });
    const pend=new Set(S.pendingDel),uns=new Set(S.unsynced),merged=new Map();
    ws.docs.forEach(d=>{if(!d.exists)return;const v=d.data();if(v&&v.id&&Array.isArray(v.exercises)&&!pend.has(v.id))merged.set(v.id,clone(v));});
    S.workouts.forEach(w=>{if(uns.has(w.id)){const r=merged.get(w.id);if(!r||(w.updatedAt||0)>=(r.updatedAt||0))merged.set(w.id,w);}});
    S.workouts=[...merged.values()];sortWorkouts();invalidateEx();
    saveLocal();
    S.unsynced.slice().forEach(pushWorkout);S.pendingDel.slice().forEach(pushDel);
    setSync(Store.state==='saving'?'saving':'ok');
    render();
    if(typeof ensureReport==='function')setTimeout(()=>{ensureModeStarters();ensureReport();},0);
    if(activeChanged){
      if(ED&&ED.mode==='live'){if(S.active){ED.w=S.active;renderEditorShell();}else{closeEditor();ED=null;render();}}
      else if(S.active&&!ED){ED={w:S.active,mode:'live'};openEditor();}
    }
  }catch(e){console.warn('db init failed',e);Store.db=null;Store.mode='local';setSync('idle');setTimeout(()=>{ensureModeStarters();ensureReport();},0);}
}

/* ---------- charts ---------- */
function niceNum(range,round){const exp=Math.floor(Math.log10(range||1));const f=range/10**exp;let n;if(round)n=f<1.5?1:f<3?2:f<7?5:10;else n=f<=1?1:f<=2?2:f<=5?5:10;return n*10**exp;}
function ticks(min,max,n=4){
  if(min===max){const p=Math.abs(min)*0.1||1;min-=p;max+=p;}
  const step=niceNum(niceNum(max-min,false)/(n-1),true);
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(8));
  return{lo,hi:hi===lo?lo+step:hi,t};
}
let gidN=0;
function lineChart(pts,{fmt=v=>nf(v,1),h=190,label='Chart'}={}){
  if(!pts.length)return'';
  const W=360,H=h,L=46,R=16,T=20,B=26;
  let x0=pts[0].x,x1=pts[pts.length-1].x;if(x0===x1){x0-=DAY*3;x1+=DAY*3;}
  const ys=pts.map(p=>p.y);const tk=ticks(Math.min(...ys),Math.max(...ys),4);
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-tk.lo)/(tk.hi-tk.lo))*(H-T-B);
  const gid='g'+(++gidN);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
  tk.t.forEach(v=>{const y=Y(v).toFixed(1);s+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${(+y+4).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`;});
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  const f=pts[0],l=pts[pts.length-1];
  if(pts.length>1)s+=`<path d="${d}L${X(l.x).toFixed(1)} ${H-B}L${X(f.x).toFixed(1)} ${H-B}Z" style="fill:url(#${gid})"/><path class="ln" d="${d}"/>`;
  if(pts.length<=40)pts.slice(0,-1).forEach(p=>{s+=`<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"/>`;});
  const lx=X(l.x),ly=Y(l.y);
  s+=`<circle class="pt-last" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5"/><text class="vl" x="${lx.toFixed(1)}" y="${(ly-10).toFixed(1)}" text-anchor="${lx>W-60?'end':'middle'}">${esc(fmt(l.y))}</text>`;
  if(pts[0].x===pts[pts.length-1].x)s+=`<text class="ax" x="${lx.toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(dfShort(l.x))}</text>`;
  else s+=`<text class="ax" x="${L}" y="${H-6}" text-anchor="start">${esc(dfShort(f.x))}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${esc(dfShort(l.x))}</text>`;
  return s+'</svg>';
}
function barChart(vals,labels,{fmt=v=>nf(v,0),h=160,label='Chart'}={}){
  const W=360,H=h,L=40,R=8,T=20,B=24,n=vals.length;
  const tk=ticks(0,Math.max(...vals,1),4);const Y=v=>T+(1-v/tk.hi)*(H-T-B);
  const bw=(W-L-R)/n,w=bw*0.62;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  tk.t.forEach(v=>{const y=Y(v).toFixed(1);s+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${(+y+4).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`;});
  const every=Math.ceil(n/6);
  vals.forEach((v,i)=>{
    const x=L+i*bw+(bw-w)/2,y=Y(v),hh=Math.max(0,H-B-y);
    if(v>0)s+=`<rect class="bar ${i===n-1?'hi':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="3"/>`;
    if((n-1-i)%every===0)s+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  const lv=vals[n-1];if(lv>0){const x=L+(n-1)*bw+bw/2;s+=`<text class="vl" x="${x.toFixed(1)}" y="${(Y(lv)-6).toFixed(1)}" text-anchor="end">${esc(fmt(lv))}</text>`;}
  return s+'</svg>';
}
function sparkline(vals){
  if(vals.length<2)return'';
  const W=84,H=28,p=3,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[p+i/(vals.length-1)*(W-2*p),H-p-(v-mn)/r*(H-2*p)]);

}

function pickExercises({multi=true,title='Add exercises',place=null}={}){

    const sh=openSheet({title,tall:true,body:`<div class="pk-top"><input class="inp" id="pkQ" type="search" placeholder="Search exercises" autocomplete="off"><div class="chips" id="pkChips"></div></div><div id="pkList"></div>`,
      foot:`<button class="btn" data-sa="new">+ New</button>${multi?'<button class="btn pri grow" data-sa="add" disabled>Select exercises</button>':''}`,onClose:()=>{if(!done)resolve([]);}});
    const L=sh.el.querySelector('#pkList'),C=sh.el.querySelector('#pkChips'),A=sh.el.querySelector('[data-sa="add"]');
    const drawChips=()=>{if(place&&!allx){C.innerHTML=`<button class="chip chip-mode" data-sa="allx" aria-pressed="false">Only ${place}</button>`;return;}C.innerHTML=`<button class="chip chip-mode" data-sa="allx" aria-pressed="${allx}">${allx?'All exercises':'Only '+(place?(place==='indoor'?'indoor':'outdoor'):esc(MODE_NAME[curMode()]))}</button>`+['All',...MUSCLES].map(x=>`<button class="chip" data-sa="mf" data-m="${esc(x)}" aria-pressed="${x===m}">${esc(x)}</button>`).join('');};
    const draw=()=>{const qq=q.trim().toLowerCase();const list=allExercises(allx?null:curMode(),allx?null:place).filter(e=>(m==='All'||e.muscle===m)&&(!qq||exName(e).toLowerCase().includes(qq)));
      L.innerHTML=list.length?`<div class="rows">${list.map(e=>`<button class="row pkrow ${sel.has(e.id)?'sel':''}" data-sa="pick" data-id="${esc(e.id)}"><i class="dot" style="--c:${mcol(e.muscle)}"></i><span class="grow"><b>${esc(exName(e))}</b><small>${esc(e.muscle)} · ${esc(KINDS[e.kind])}</small></span>${multi?`<span class="pk-chk">${I.check}</span>`:''}</button>`).join('')}</div>`:'<p class="empty">No match. Tap “+ New” to create it.</p>';};
    const upd=()=>{if(A){A.disabled=!sel.size;A.textContent=sel.size?`Add ${sel.size} exercise${sel.size>1?'s':''}`:'Select exercises';}};
    drawChips();draw();
    sh.el.addEventListener('input',e=>{if(e.target.id==='pkQ'){q=e.target.value;draw();}});
    sh.el.addEventListener('click',async e=>{const b=e.target.closest('[data-sa]');if(!b||b.disabled)return;const a=b.dataset.sa;
      if(a==='mf'){m=b.dataset.m;drawChips();draw();}
      if(a==='allx'){allx=!allx;drawChips();draw();}
      if(a==='pick'){const id=b.dataset.id;if(!multi){done=true;resolve([id]);sh.close();return;}if(sel.has(id))sel.delete(id);else sel.add(id);b.classList.toggle('sel');upd();}

function prevMatch(prev,sets,si){if(!prev)return null;const t=sets[si].type||'n';let idx=0;for(let i=0;i<si;i++)if((sets[i].type||'n')===t)idx++;return prev.filter(x=>(x.type||'n')===t)[idx]||null;}
function srcFor(p,s){const t=s.target||{};p=p||{};return{w:t.w??p.w,r:t.r??p.r,t:t.t??p.t,d:t.d??p.d};}
function isLivePR(exId,k,s){if(ED.mode!=='live'||s.type==='w'||!hasData(k,s))return false;const b=recs().best[exId];if(!b||!b.n)return false;const m=metrics(k,s);return REC_KEYS[k].some(key=>key!=='vol'&&m[key]>b[key]+1e-9);}

    ${rows}<div class="exb-f"><button class="btn sm" data-act="addSet">+ Add set</button>${ED.mode==='live'?`<button class="btn sm" data-act="restCfg">Rest ${rest?fmtDur(rest):'off'}</button>`:''}</div></section>`;

      if(!any){toast('Enter at least one measurement');return;}
      delete e.sample;
      let i=S.body.findIndex(x=>x.id===e.id);
      if(i<0){const same=S.body.findIndex(x=>sod(x.date)===e.date&&!x.sample);if(same>=0){e.id=S.body[same].id;S.body[same]={...S.body[same],...e};}else S.body.push(e);}else S.body[i]=e;
      touch('body');sh.close();render();toast('Saved');
    }

  });

/* ---------- export / import ---------- */
const csvq=v=>{v=v==null?'':String(v);return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const plain=v=>v==null?'':String(+(+v).toFixed(2));
function csvWorkouts(){
  const rows=[['Date','Workout','Duration (min)','Exercise','Set','Set type','Weight ('+U.w()+')','Reps','Distance ('+U.d()+')','Seconds','Workout note']];
  [...S.workouts].sort((a,b)=>a.start-b.start).forEach(w=>w.exercises.forEach(e=>{const ex=getEx(e.exId);e.sets.forEach((s,i)=>rows.push([isoLocal(w.start),w.name,Math.round((w.end-w.start)/60000),exName(ex),i+1,{w:'Warm-up',d:'Drop set',f:'Failure'}[s.type]||'Normal',plain(wv(s.w)),s.r??'',plain(dv(s.d)),s.t??'',w.note||'']));}));
  return rows.map(r=>r.map(csvq).join(',')).join('\n');
}
function csvBody(){
  const rows=[['Date',...BODY.map(m=>`${m.label} (${bUnit(m)})`)]];
  [...S.body].sort((a,b)=>a.date-b.date).forEach(e=>rows.push([toDateInput(e.date),...BODY.map(m=>e[m.k]!=null?plain(bConv(m,e[m.k])):'')]));
  return rows.map(r=>r.map(csvq).join(',')).join('\n');
}
async function offerFile(filename,text){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){try{await dl.save({filename,data:text});toast('Saved '+filename);return;}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Another save is still waiting for you');return;}}}
  const sh=openSheet({title:filename,body:`<p class="msg">Saving files isn’t available here. Copy the text below and paste it into a file.</p><textarea class="inp code" id="fbText" rows="12" readonly>${esc(text)}</textarea>`,foot:'<button class="btn pri block" data-sa="copy">Copy to clipboard</button>'});
  sh.el.addEventListener('click',async e=>{if(!e.target.closest('[data-sa="copy"]'))return;try{await navigator.clipboard.writeText(text);toast('Copied');}catch(err){const ta=sh.el.querySelector('#fbText');ta.focus();ta.select();toast('Text selected. Use Copy from the menu.');}});
}
function backupJson(){return JSON.stringify({app:'Setbook',version:1,exported:new Date().toISOString(),settings:S.settings,customEx:S.customEx,routines:S.routines,workouts:S.workouts,body:S.body},null,1);}
function importJson(text){
  let d;try{d=JSON.parse(text);}catch(e){toast('That file isn’t valid JSON');return;}
  if(!d||d.app!=='Setbook'||!Array.isArray(d.workouts)){toast('That file isn’t an Iron Ledger backup');return;}
  confirmSheet('Restore backup?',`This replaces all your data with the backup${d.exported?' from '+dfDay(d.exported):''}: ${d.workouts.length} workouts, ${(d.routines||[]).length} routines, ${(d.body||[]).length} body entries.`,'Replace my data',true).then(ok=>{
    if(!ok)return;
    const nw=d.workouts.filter(w=>w&&w.id&&Array.isArray(w.exercises)&&w.start);const newIds=new Set(nw.map(w=>w.id));
    const oldIds=S.workouts.map(w=>w.id).filter(id=>!newIds.has(id));
    S.settings={...DEFAULT_SETTINGS,...(d.settings||{})};S.customEx=Array.isArray(d.customEx)?d.customEx:[];S.routines=Array.isArray(d.routines)?d.routines:[];S.body=Array.isArray(d.body)?d.body:[];
    S.workouts=nw;sortWorkouts();invalidateEx();
    S.pendingDel=[...new Set([...S.pendingDel.filter(id=>!newIds.has(id)),...oldIds])];S.unsynced=nw.map(w=>w.id);
    oldIds.forEach(pushDel);nw.forEach(w=>pushWorkout(w.id));
    ['settings','library','routines','body'].forEach(touch);
    sheets.slice().forEach(s=>s.close());render();toast('Backup restored');
  });
}

/* ---------- example data ---------- */
function makeSample(){
  const plans=[{name:'Push day',rid:'r_push',ex:[['bench',60,8,4],['ohp',37.5,8,3],['dbincline',20,10,3],['latraise',8,12,3],['pushdown',25,12,3]]},
    {name:'Pull day',rid:'r_pull',ex:[['deadlift',100,5,3],['pullup',null,7,3],['cablerow',50,10,3],['facepull',20,15,3],['dbcurl',12,10,3]]},
    {name:'Leg day',rid:'r_legs',ex:[['squat',80,6,4],['rdl',70,8,3],['legpress',140,10,3],['legcurl',35,12,3],['calfstand',60,12,4]]}];
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const today=sod(Date.now()),mon=weekStart(today)-6*7*DAY,out=[];let k=0;
  for(let wk=0;wk<7;wk++)for(const off of[0,2,4]){
    const day=mon+(wk*7+off)*DAY;if(day>=today)continue;
    const p=plans[k%3],cyc=Math.floor(k/3);k++;
    const start=day+(17*60+Math.floor(rnd()*100))*60000,dur=(48+Math.floor(rnd()*24))*60000;
    const exercises=p.ex.map(([exId,w0,r0,n])=>{const ex=getEx(exId);const step=ex.equip==='Dumbbell'?2:2.5;const w=w0==null?null:Math.round(w0*(1+0.025*cyc)/step)*step;const sets=[];
      if(['bench','squat','deadlift'].includes(exId))sets.push({type:'w',w:Math.round(w*0.5/2.5)*2.5,r:10});
      for(let i=0;i<n;i++){if(ex.kind==='r')sets.push({r:r0+Math.floor(cyc/2)-(i&&rnd()<0.5?1:0)});else sets.push({w,r:r0-(i===n-1&&rnd()<0.45?1:0)});}
      return{exId,sets};});
    out.push({id:'s_'+uid(),name:p.name,routineId:p.rid,start,end:start+dur,note:'',sample:true,exercises,updatedAt:Date.now()});
  }
  const body=[];for(let wk=0;wk<7;wk++){const date=mon+wk*7*DAY;if(date>today)continue;const e={id:'s_b'+uid(),date,sample:true,weight:+(82.6-wk*0.24+(rnd()-0.5)*0.4).toFixed(1),fat:+(18.6-wk*0.15).toFixed(1)};if(wk%2===0){e.waist=+(88.5-wk*0.35).toFixed(1);e.biceps=+(36+wk*0.08).toFixed(1);}body.push(e);}
  return{workouts:out,body};
}
function loadSamples(){
  const{workouts,body}=makeSample();
  workouts.forEach(w=>{S.workouts.push(w);S.unsynced.push(w.id);});sortWorkouts();ver++;S.body.push(...body);
  saveLocal();workouts.forEach(w=>pushWorkout(w.id));touch('body');render();toast(`Added ${workouts.length} example workouts`);
}
function clearSamples(){
  S.workouts.filter(w=>w.sample).map(w=>w.id).forEach(deleteWorkout);
  S.body=S.body.filter(b=>!b.sample);touch('body');render();toast('Examples removed');
}

function overloadHint(e){
  if(!ED||(ED.mode==='edit'&&!ED.isNew))return null;
  const ex=getEx(e.exId),k=ex.kind;const prev=prevSetsFor(e.exId,ED.w.start,ED.w.id);if(!prev)return null;
  const work=prev.filter(s=>s.type!=='w'&&hasData(k,s));if(!work.length)return null;
  const tg=e.sets.find(s=>s.target&&s.target.r&&s.type!=='w');const tgtR=tg?tg.target.r:null;
  if(k==='wr'){
    const top=Math.max(...work.map(s=>s.w));const at=work.filter(s=>Math.abs(s.w-top)<1e-6);
    const goal=tgtR||at[0].r;const hit=at.every(s=>s.r>=goal);
    const step=isLb()?5/KG2LB:(ex.equip==='Dumbbell'?(top<10?1:2):2.5);
    const reps=at.map(s=>s.r).join(', ');
    if(hit&&top>0)return{up:true,w:top+step,r:goal,title:`Go up to ${wf(top+step)} ${U.w()} × ${goal}`,why:`You hit ${reps} reps at ${wf(top)} ${U.w()} last time.`};
    if(top===0)return{up:true,r:goal+1,title:`Aim for ${goal+1} reps per set`,why:`You did ${reps} last time.`};
    return{up:false,w:top,r:goal,title:`Stay at ${wf(top)} ${U.w()}, aim for ${goal} reps`,why:`Last time: ${reps}. Get every set to ${goal} before adding weight.`};
  }
  if(k==='r'){const best=Math.max(...work.map(s=>s.r));const goal=tgtR||best;const hit=work.every(s=>s.r>=goal);const reps=work.map(s=>s.r).join(', ');
    return hit?{up:true,r:goal+1,title:`Aim for ${goal+1} reps per set`,why:`You did ${reps} last time.`}:{up:false,r:goal,title:`Aim for ${goal} reps on every set`,why:`Last time: ${reps}.`};}
  if(k==='t'){const best=Math.max(...work.map(s=>s.t));return{up:true,t:best+5,title:`Try ${fmtDur(best+5)} per set`,why:`Your longest last time was ${fmtDur(best)}.`};}
  return null;
}
function hintHtml(e){
  const h=overloadHint(e);if(!h)return'';
  return`<div class="hint ${h.up?'up':''}"><span class="hint-ic">${h.up?I.up:'='}</span><span class="grow"><b>${esc(h.title)}</b><small>${esc(h.why)}</small></span>${e.hintUsed?'<span class="hint-ok">Applied</span>':'<button class="btn sm" data-act="applyHint">Use</button>'}</div>`;
}
function applyHint(e){
  const h=overloadHint(e);if(!h)return;
  e.sets.forEach(s=>{if(s.type==='w'||s.done)return;const t={...(s.target||{})};if(h.w!=null)t.w=h.w;if(h.r!=null)t.r=h.r;if(h.t!=null)t.t=h.t;s.target=t;});
  e.hintUsed=true;
}

/* ---------- supersets ---------- */
function ssRuns(X){
  const out=X.map(()=>null);let L=0;
  for(let i=0;i<X.length;){
    let j=i;while(X[i].ss&&j+1<X.length&&X[j+1].ss===X[i].ss)j++;
    if(j>i){const lab=String.fromCharCode(65+(L++%26));for(let q=i;q<=j;q++)out[q]={lab,pos:q===i?'first':q===j?'last':'mid',next:q<j?X[q+1]:null};}
    i=j+1;
  }
  return out;
}
function normalizeSS(X){const runs=ssRuns(X);X.forEach((e,i)=>{if(!runs[i])delete e.ss;});}
function toggleSS(X,ei){
  const a=X[ei],b=X[ei+1];if(!b)return;
  if(a.ss&&a.ss===b.ss){const nid='s'+uid();for(let j=ei+1;j<X.length&&X[j].ss===a.ss;j++)X[j].ss=nid;}
  else{const id=a.ss||b.ss||('s'+uid());const old=b.ss;if(old&&old!==id)X.forEach(x=>{if(x.ss===old)x.ss=id;});a.ss=id;b.ss=id;}
  normalizeSS(X);
}

function regionsFor(ex){
  if(REG[ex.id])return REG[ex.id];
  const n=(ex.name||'').toLowerCase();
  if(ex.custom){
    if(/hammer/.test(n))return REG.hammer;
    if(/leg curl|hamstring/.test(n))return HAM;
    if(/leg ext/.test(n))return {quads:1};
    if(/calf/.test(n))return CALF;
    if(/curl/.test(n))return CURL;
    if(/tricep|pushdown|skull|kickback/.test(n))return TRI;
    if(/rear|reverse fly|face pull/.test(n))return REAR;
    if(/lateral|side raise/.test(n))return LAT;
    if(/shoulder press|overhead|military/.test(n))return OHPR;
    if(/shrug/.test(n))return REG.shrug;
    if(/pulldown|pull-?up|chin/.test(n))return VPULL;
    if(/\brow\b/.test(n))return ROW;
    if(/fly|pec deck|crossover/.test(n))return FLY;
    if(/incline/.test(n))return INCL;
    if(/decline/.test(n))return DECL;
    if(/bench|chest press|push-?up/.test(n))return PRESS;
    if(/hip thrust|glute/.test(n))return REG.hipthrust;
    if(/squat|leg press|lunge/.test(n))return KNEE;
    if(/deadlift|rdl/.test(n))return REG.rdl;
  }
  return REG_GROUP[ex.muscle]||{};
}
function regionStats(days=7){
  const since=Date.now()-days*DAY,sets={},last={};
  S.workouts.forEach(w=>w.exercises.forEach(e=>{const ex=getEx(e.exId);const n=e.sets.filter(s=>s.type!=='w'&&hasData(ex.kind,s)).length;if(!n)return;
    Object.entries(regionsFor(ex)).forEach(([r,f])=>{if(w.start>=since)sets[r]=(sets[r]||0)+n*f;if(!last[r]||w.start>last[r])last[r]=w.start;});}));
  return{sets,last};
}

  if(top.length){L.push('\nRECORDS:');top.forEach(([id,h])=>{const ex=getEx(id),b=r.best[id];L.push(`${exName(ex)} [${h.length} sessions]: `+REC_KEYS[ex.kind].map(k=>`${REC_LABEL[k]} ${recFmt(k,b[k])}`).join(', '));});}
  const{sets}=regionStats(7);L.push('\nSETS PER MUSCLE, LAST 7 DAYS: '+Object.keys(REGION_LABEL).map(k=>`${REGION_LABEL[k]} ${Math.round(sets[k]||0)}`).join(', '));
  const bw=S.body.filter(e=>e.weight!=null).sort((a,b)=>a.date-b.date);if(bw.length)L.push(`\nBODY WEIGHT: latest ${wf(bw[bw.length-1].weight)} ${u} on ${toDateInput(bw[bw.length-1].date)}; first logged ${wf(bw[0].weight)} ${u} on ${toDateInput(bw[0].date)}.`);
  if(S.routines.length)L.push('\nROUTINES: '+S.routines.map(x=>`${x.name} (${x.exercises.map(e=>exName(getEx(e.exId))).join(', ')})`).join('; '));

function mdLite(t){
  const lines=esc(t).split('\n');let h='',inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>');
  for(const raw of lines){const l=raw.trim();const m=l.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if(m){if(!inList){h+='<ul>';inList=true;}h+=`<li>${inl(m[2])}</li>`;continue;}
    if(inList){h+='</ul>';inList=false;}
    if(!l)continue;const hd=l.match(/^#{1,4}\s+(.*)/);h+=hd?`<p><b>${inl(hd[1])}</b></p>`:`<p>${inl(l)}</p>`;}
  if(inList)h+='</ul>';return h;
}
const stripPlan=t=>{const i=t.indexOf('```plan');return(i>=0?t.slice(0,i):t).trim();};
function parsePlan(t){
  const m=t.match(/```plan\s*([\s\S]*?)```/);if(!m)return null;
  try{const p=JSON.parse(m[1]);if(!p||!Array.isArray(p.exercises))return null;
    const ex=p.exercises.filter(x=>x&&exMap().has(String(x.id))).slice(0,12);if(!ex.length)return null;
    return{name:String(p.name||'Coach workout').slice(0,60),exercises:ex.map(x=>({id:String(x.id),sets:Math.min(10,Math.max(1,parseInt(x.sets)||3)),reps:parseNum(x.reps),weight:parseNum(x.weight)}))};}catch(e){return null;}
}
function startPlan(p){
  startWorkout({name:p.name,exercises:p.exercises.map(x=>{const k=getEx(x.id).kind;const t={};
    if(k==='wr'){if(x.weight!=null)t.w=isLb()?x.weight/KG2LB:x.weight;if(x.reps)t.r=Math.round(x.reps);}
    else if(k==='r'){if(x.reps)t.r=Math.round(x.reps);}else if(k==='t'){if(x.reps)t.t=Math.round(x.reps);}
    return{exId:x.id,sets:Array.from({length:x.sets},()=>Object.keys(t).length?{target:{...t}}:{})};})});
}

async function askCoach(q){
  if(CO.busy)return;
  if(!SAMPLE){toast('The coach isn’t available here');return;}
  const hist=CO.turns.filter(t=>!t.pending&&t.content).map(t=>({role:t.role,content:t.content})).slice(-10);
  while(hist.length&&hist[0].role!=='user')hist.shift();
  CO.turns.push({role:'user',content:q});const a={role:'assistant',content:'',pending:true};CO.turns.push(a);
  CO.busy=true;CO.ctl=new AbortController();CO.draw&&CO.draw();
  try{
    const res=await SAMPLE([{role:'user',content:coachContext()},...hist,{role:'user',content:q}],{cache:false,signal:CO.ctl.signal,onText:({text})=>{a.pending=false;a.content=text;CO.draw&&CO.draw();}});
    a.pending=false;a.content=res.text;a.plan=parsePlan(res.text);if(res.truncated)a.note='The answer was cut short. Ask for less at a time.';
  }catch(e){
    a.pending=false;a.content=e&&e.text||'';const c=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){COACH=false;a.note='The coach isn’t available for this account.';if(ui.tab==='workout')render();}
    else if(c==='cancelled')a.note=a.content?'Stopped.':'';
    else if(c==='rate_limited')a.note='You’ve reached your Claude usage limit for now. Try again later.';
    else if(c==='session_expired')a.note='Sign in to Claude again, then retry.';
    else if(c==='refused'){a.content='';a.note='The coach couldn’t answer that. Try asking differently.';}
    else a.note='Something went wrong. Try again.';
    if(!a.content&&!a.note)CO.turns.splice(CO.turns.indexOf(a),1);
  }finally{CO.busy=false;CO.ctl=null;CO.draw&&CO.draw();}
}

/* ---------- type to log ---------- */
function typeLogPrompt(txt){
  return `Convert this gym log into JSON. Reply with only a JSON array like [{"id":"bench","sets":[{"weight":70,"reps":8},{"weight":70,"reps":8}]}].
Rules:
- Match each exercise to the closest id from EXERCISE IDS ("bench" = barbell bench press unless dumbbells are mentioned, "pullups" = pullup, "db" = dumbbell).
- "3x8 70" or "3x8 @70" means 3 sets of 8 reps at 70. "70x8, 75x6" are separate sets. Expand every set into its own object.
- "weight" is in ${U.w()}. Leave it out for bodyweight exercises or when no weight is given.
- Warm-up sets get "warmup":true. Timed sets use "sec" (seconds). Distance uses "km" in ${U.d()}.
- If nothing in the list matches, use {"name":"<exercise as written>","sets":[...]} instead of "id".
EXERCISE IDS: ${allExercises().map(e=>`${e.id}=${exName(e)}`).join('; ')}
LOG:
${txt.slice(0,3000)}`;
}
function applyTyped(arr){
  const out={sets:0,created:0};if(!Array.isArray(arr)||!ED)return out;
  arr.forEach(item=>{
    if(!item||!Array.isArray(item.sets))return;
    let id=item.id&&exMap().has(String(item.id))?String(item.id):null;
    if(!id){const nm=String(item.name||item.id||'').trim();if(!nm)return;
      const f=allExercises().find(e=>exName(e).toLowerCase()===nm.toLowerCase()||e.name.toLowerCase()===nm.toLowerCase());
      if(f)id=f.id;else{const hasW=item.sets.some(s=>s&&s.weight!=null),onlyT=item.sets.some(s=>s&&s.sec)&&!item.sets.some(s=>s&&s.reps);
        const ex={id:'c_'+uid(),name:nm.charAt(0).toUpperCase()+nm.slice(1),muscle:'Full body',equip:'Other',kind:hasW?'wr':onlyT?'t':'r'};S.customEx.push(ex);touch('library');id=ex.id;out.created++;}}
    const k=getEx(id).kind;
    const sets=item.sets.slice(0,30).map(s=>{if(!s)return null;const o={};
      const w=parseNum(s.weight??s.kg),r=parseNum(s.reps),t=parseNum(s.sec),d=parseNum(s.km);
      if(w!=null)o.w=isLb()?w/KG2LB:w;if(r!=null)o.r=Math.round(r);if(t!=null)o.t=Math.round(t);if(d!=null)o.d=isLb()?d/KM2MI:d;
      if(s.warmup)o.type='w';
      if(hasData(k,o)){o.done=true;return o;}
      if(o.r){const p={target:{r:o.r}};if(o.type)p.type=o.type;return p;}
      return null;}).filter(Boolean);
    if(!sets.length)return;
    const e=ED.w.exercises.find(x=>x.exId===id);
    if(e)e.sets=e.sets.filter(s=>hasData(k,s)).concat(sets);else ED.w.exercises.push({exId:id,sets});
    out.sets+=sets.length;
  });
  return out;
}

    finally{if(!sh.closed){btn.disabled=false;btn.textContent='Add to workout';}}

let REPORT_BUSY=false,REPORT_TRIED='';
function lastWeekStats(){
  const cur=weekStart(Date.now());const a=new Date(cur);a.setDate(a.getDate()-7);const from=a.getTime();
  const ws=S.workouts.filter(w=>w.start>=from&&w.start<cur);
  const vol=ws.reduce((s,w)=>s+workoutVolume(w),0),mins=ws.reduce((s,w)=>s+(w.end-w.start)/60000,0);
  const prs=recs().prList.filter(p=>p.date>=from&&p.date<cur);
  const sets={};ws.forEach(w=>w.exercises.forEach(e=>{const ex=getEx(e.exId);const n=e.sets.filter(s=>s.type!=='w'&&hasData(ex.kind,s)).length;Object.entries(regionsFor(ex)).forEach(([r,f])=>{sets[r]=(sets[r]||0)+n*f;});}));
  const missed=['chest','lats','frontdelts','reardelts','quads','hamstrings','glutes','biceps','triceps','abs'].filter(r=>!(sets[r]>0)).map(r=>REGION_LABEL[r]);

  z.file('word/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="en-GB"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="259" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>');
  z.file('word/document.xml',buildTrainerDocXml(w0));
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function askName(){return new Promise(res=>{let v=null;const sh=openSheet({title:'Your name',body:`<p class="msg">This name appears on the report for your trainer.</p><input id="nmIn" class="inp" autocomplete="name" placeholder="e.g. Alex Smith" value="${esc(S.settings.name||'')}">`,foot:'<button class="btn pri block" data-sa="ok">Continue</button>',onClose:()=>res(v)});
  sh.el.addEventListener('click',e=>{if(!e.target.closest('[data-sa="ok"]'))return;const n=sh.el.querySelector('#nmIn').value.trim();if(!n){toast('Enter your name');return;}S.settings.name=n.slice(0,60);touch('settings');v=n;sh.close();});setTimeout(()=>{const i=sh.el.querySelector('#nmIn');i&&i.focus();},250);});}
async function shareTrainerWeek(){
  if(!S.settings.name){const n=await askName();if(!n)return;}
  const w0=trainerWeekStart();const kw=pad2(isoWeek(w0));
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(!dl){toast('Saving files isn’t available here');return;}
  toast(`Creating the KW${kw} report…`);
  let blob;try{blob=await buildTrainerDocx(w0);}catch(e){toast('Couldn’t create the Word file. Check your connection and try again.');return;}
  try{await dl.save({filename:`Training-week-KW${kw}-${new Date(w0).getFullYear()}.docx`,data:blob});toast('Word file ready to share');}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'Another save is still waiting for you':'Couldn’t save the file');}
}

/* ---------- boot ---------- */
document.documentElement.lang='en-GB';
loadLocal();
const hashTab=(location.hash||'').slice(1);if(VIEWS[hashTab])ui.tab=hashTab;
render();
if(S.active){ED={w:S.active,mode:'live'};openEditor();}
setTimeout(initDb,0);
})();
</script>
